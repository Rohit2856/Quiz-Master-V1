{% extends "base.html" %}
{% block content %}
<div class="container mt-4">
    <h2>Manage Subjects</h2>
    
    <div class="card mb-4">
        <div class="card-header">
            Create New Subject
        </div>
        <div class="card-body">
            <form method="POST">
                <div class="form-group">
                    <label for="subject_name">Subject Name</label>
                    <input type="text" class="form-control" name="subject_name" required>
                </div>
                <div class="form-group">
                    <label for="subject_desc">Description</label>
                    <textarea class="form-control" name="subject_desc" rows="3"></textarea>
                </div>
                <button type="submit" class="btn btn-success">Create Subject</button>
            </form>
        </div>
    </div>

    <div class="card">
        <div class="card-header">
            Existing Subjects
        </div>
        <div class="card-body">
            <table class="table table-hover">
                <thead>
                    <tr>
                        <th>ID</th>
                        <th>Subject Name</th>
                        <th>Description</th>
                        <th>Actions</th>
                    </tr>
                </thead>
                <tbody>
                    {% for subject in subjects %}
                    <tr>
                        <td>{{ subject.id }}</td>
                        <td>{{ subject.name }}</td>
                        <td>{{ subject.description|truncate(50) }}</td>
                        <td>
                            <a href="#" class="btn btn-sm btn-warning">Edit</a>
                            <form method="POST" action="{{ url_for('delete_subject', subject_id=subject.id) }}" style="display:inline">
                                <button type="submit" class="btn btn-sm btn-danger">Delete</button>
                            </form>
                        </td>
                    </tr>
                    {% endfor %}
                </tbody>
            </table>
        </div>
    </div>
</div>
{% endblock %}

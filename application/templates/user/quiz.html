{% extends "base.html" %}

{% block title %}Quiz Attempt{% endblock %}

{% block content %}
<div class="container">
    <h2>Quiz: {{ quiz.chapter.name }} ({{ quiz.chapter.subject.name }})</h2>
    <form method="POST">
        {% for question in questions %}
        <div class="mb-4">
            <p><strong>{{ loop.index }}. {{ question.question_statement }}</strong></p>
            <div class="form-check">
                <input type="radio" name="question_{{ question.id }}" value="1" id="q{{ question.id }}_1" class="form-check-input">
                <label for="q{{ question.id }}_1" class="form-check-label">{{ question.option1 }}</label>
            </div>
            <div class="form-check">
                <input type="radio" name="question_{{ question.id }}" value="2" id="q{{ question.id }}_2" class="form-check-input">
                <label for="q{{ question.id }}_2" class="form-check-label">{{ question.option2 }}</label>
            </div>
            <div class="form-check">
                <input type="radio" name="question_{{ question.id }}" value="3" id="q{{ question.id }}_3" class="form-check-input">
                <label for="q{{ question.id }}_3" class="form-check-label">{{ question.option3 }}</label>
            </div>
            <div class="form-check">
                <input type="radio" name="question_{{ question.id }}" value="4" id="q{{ question.id }}_4" class="form-check-input">
                <label for="q{{ question.id }}_4" class="form-check-label">{{ question.option4 }}</label>
            </div>
        </div>
        {% endfor %}
        <button type="submit" class="btn btn-success">Submit Quiz</button>
    </form>
</div>
{% endblock %}
